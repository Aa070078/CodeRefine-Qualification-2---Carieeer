<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Carieeer system design</title><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1200" fill="white"/>
<text x="40" y="25" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="32" fill="#1e293b">Carieeer - Main APIs</text>
<text x="40" y="74" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">All routes start with /api. Examples show inputs -&gt; outputs. Full endpoint table is in README.</text>
<rect x="40" y="160" width="730" height="245" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="405" y="204.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Account and profile</text><text x="405" y="235.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">POST /auth/login</text><text x="405" y="266.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">{email, password} -&gt; {access_token}</text><text x="405" y="298.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">PUT /me/profile</text><text x="405" y="329.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">{skills, experience, education, ...} -&gt; {profile}</text>
<rect x="830" y="160" width="730" height="245" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="1195" y="204.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Companies and jobs</text><text x="1195" y="235.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">POST /companies</text><text x="1195" y="266.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">{name, description, website} -&gt; {company_id}</text><text x="1195" y="298.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">POST /companies/:id/jobs</text><text x="1195" y="329.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">{title, skills, salary, eligibility} -&gt; {job_id, status}</text>
<rect x="40" y="470" width="730" height="245" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="405" y="514.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Search and matching</text><text x="405" y="545.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">GET /jobs?q=...&amp;skills=... -&gt; {jobs}</text><text x="405" y="576.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">GET /candidates?skills=... -&gt; {candidates}</text><text x="405" y="608.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">GET /me/matches -&gt; {jobs, computed_at}</text><text x="405" y="639.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">GET /jobs/:id/matches -&gt; {candidates}</text>
<rect x="830" y="470" width="730" height="245" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="1195" y="514.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Applications</text><text x="1195" y="545.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">POST /jobs/:id/applications</text><text x="1195" y="576.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">{resume_file_id} + key -&gt; {application_id, status}</text><text x="1195" y="608.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">PATCH /applications/:id/status</text><text x="1195" y="639.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">{status, expected_version} -&gt; {status, version}</text>
<rect x="40" y="780" width="730" height="245" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="405" y="824.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Skill gaps and roadmaps</text><text x="405" y="855.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">POST /me/skill-gaps</text><text x="405" y="886.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">{target_role_id} -&gt; {matched_skills, missing_skills}</text><text x="405" y="918.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">POST /me/roadmaps</text><text x="405" y="949.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">{skill_gap_id} -&gt; {roadmap_id, milestones}</text>
<rect x="830" y="780" width="730" height="245" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="1195" y="827.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Notifications</text><text x="1195" y="857.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">GET /me/notifications -&gt; {notifications}</text><text x="1195" y="887.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">PATCH /me/notifications/:id</text><text x="1195" y="917.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">{is_read: true} -&gt; {notification}</text><text x="1195" y="947.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">PUT /me/notification-preferences -&gt; {preferences}</text>
<text x="40" y="1100" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">201 created | 200 success | 400 invalid | 401 unauthenticated | 403 forbidden | 409 duplicate / version conflict</text></svg>