<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Carieeer system design</title><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1200" fill="white"/>
<text x="40" y="25" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="32" fill="#1e293b">Carieeer | API boundaries</text>
<text x="40" y="74" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">REST /v1 • Authenticated identity • Cursor lists &lt;=100 • Errors carry code + request_id</text>
<ellipse cx="795" cy="210" rx="755" ry="65" fill="#ffd8a8" stroke="#334155" stroke-width="2"/>
<text x="795" y="181.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Browser / mobile candidate and employer clients</text><text x="795" y="210" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">OIDC + PKCE login; cookie CSRF protection; current resource authorization</text>
<polyline points="795,275 795,355" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="766.5" y="286" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">HTTPS</text>
<rect x="40" y="355" width="1510" height="130" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="795" y="378.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">BACKEND CONTRACT</text><text x="795" y="406.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Idempotency-Key on commands (24 h) • If-Match on updates (428 missing / 412 stale)</text><text x="795" y="433.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Same key + changed request = 409 • Hidden resource = 404 • Quota = 429</text>
<rect x="40" y="555" width="470" height="205" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="275" y="591.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">IDENTITY / TALENT / COMPANY</text><text x="275" y="618.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /me   PATCH /me/profile</text><text x="275" y="644.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">POST /me/files + complete</text><text x="275" y="670.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">POST /companies</text><text x="275" y="696.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">PUT /companies/{id}/employers/{uid}</text>
<rect x="560" y="555" width="470" height="205" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="795" y="591.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">JOBS / DISCOVERY / MATCHES</text><text x="795" y="618.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">POST /companies/{id}/jobs</text><text x="795" y="644.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">POST /jobs/{id}/publish or close</text><text x="795" y="670.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /search/jobs or candidates</text><text x="795" y="696.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /me/matches; POST .../refresh</text>
<rect x="1080" y="555" width="470" height="205" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="1315" y="591.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">APPLICATIONS / PIPELINE</text><text x="1315" y="618.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">POST /jobs/{id}/applications</text><text x="1315" y="644.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /me/applications</text><text x="1315" y="670.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /jobs/{id}/applications</text><text x="1315" y="696.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">PATCH /applications/{id}/status</text>
<polyline points="275,485 275,555" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<polyline points="795,485 795,555" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<polyline points="1315,485 1315,555" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<rect x="40" y="825" width="470" height="220" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="275" y="856.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">CAREER GROWTH</text><text x="275" y="882.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /target-roles</text><text x="275" y="908.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">POST /me/skill-gaps</text><text x="275" y="935" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /me/tasks/{id}</text><text x="275" y="961.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">POST /me/roadmaps</text><text x="275" y="987.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">PATCH .../milestones/{id}</text>
<rect x="560" y="825" width="470" height="220" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="795" y="856.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">NOTIFICATIONS / SAVES</text><text x="795" y="882.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /me/notifications</text><text x="795" y="908.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">PUT .../{id}/read</text><text x="795" y="935" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET / PUT notification-preferences</text><text x="795" y="961.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">GET /me/saved-jobs</text><text x="795" y="987.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">PUT / DELETE .../{job_id}</text>
<rect x="1080" y="825" width="470" height="220" rx="14" fill="#fff3bf" stroke="#334155" stroke-width="2"/>
<text x="1315" y="856.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">COMMAND OUTCOMES</text><text x="1315" y="882.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Apply: 201, duplicate/closed: 409</text><text x="1315" y="908.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Status: 200, invalid move: 422</text><text x="1315" y="935" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Async work: 202 + owned task ID</text><text x="1315" y="961.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Engine never runs in a GET</text><text x="1315" y="987.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Valid transitions in docs/api-design.md</text>
<text x="40" y="1100" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Lower cards are additional routes on the same backend. Requests, responses and access rules: docs/api-design.md</text></svg>