<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Carieeer system design</title><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1200" fill="white"/>
<text x="40" y="25" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="32" fill="#1e293b">Carieeer | Critical flows</text>
<text x="40" y="74" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Solid = synchronous call / transaction write   Dashed = asynchronous scheduling or delivery</text>
<text x="40" y="130" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">A. Job publication: commit first; indexing and matching consume independently</text>
<rect x="40" y="190" width="350" height="120" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="215" y="222.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Recruiter publishes job</text><text x="215" y="250" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Auth + If-Match + validation</text>
<rect x="510" y="190" width="475" height="120" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="747.5" y="222.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">PostgreSQL transaction</text><text x="747.5" y="250" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Job + version + Outbox + receipt</text>
<polyline points="390,250 510,250" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<rect x="1105" y="190" width="445" height="120" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="1327.5" y="222.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Relay → RabbitMQ</text><text x="1327.5" y="250" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Confirmed durable delivery</text>
<polyline points="985,250 1105,250" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<rect x="1105" y="400" width="445" height="115" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="1327.5" y="430" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Indexing worker → OpenSearch</text><text x="1327.5" y="457.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">DB snapshot + version guard</text>
<polyline points="1325,310 1325,400" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<rect x="510" y="400" width="475" height="115" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="747.5" y="430" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Matching worker → black-box engine</text><text x="747.5" y="457.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Bounded inputs • request ID • retry</text>
<polyline points="1200,310 1200,345 745,345 745,400" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<rect x="40" y="400" width="350" height="115" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="215" y="430" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Persist complete MatchSet</text><text x="215" y="457.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">DB active pointer + outbox</text>
<polyline points="510,460 390,460" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<rect x="40" y="595" width="1510" height="90" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="795" y="626.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">MatchSetReady → broker → notification planner → inbox / preference-controlled email or push</text>
<polyline points="215,515 215,595" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<text x="40" y="735" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">B. Candidate application: no engine, search or notification call inside the transaction</text>
<rect x="40" y="800" width="350" height="140" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="215" y="828.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Apply + Idempotency-Key</text><text x="215" y="856.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Authenticate candidate</text><text x="215" y="883.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Validate owned clean resume</text>
<rect x="510" y="790" width="475" height="160" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="747.5" y="817.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">PostgreSQL transaction</text><text x="747.5" y="843.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Job SHARE lock + open check</text><text x="747.5" y="870" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">UNIQUE(candidate, job) insert</text><text x="747.5" y="896.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Application + history + outbox + receipt</text>
<polyline points="390,865 510,865" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<rect x="1105" y="800" width="445" height="140" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="1327.5" y="828.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Relay → broker → notifications</text><text x="1327.5" y="856.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Planner dedupe; send later</text><text x="1327.5" y="883.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Provider retry / unknown / DLQ</text>
<polyline points="985,865 1105,865" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<rect x="40" y="1010" width="735" height="125" rx="14" fill="#fff3bf" stroke="#334155" stroke-width="2"/>
<text x="407.5" y="1031.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">HTTP after commit: 201 Applied</text><text x="407.5" y="1058.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Same-key retry: original response</text><text x="407.5" y="1086.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Different-key duplicate / closed job: 409</text>
<rect x="825" y="1010" width="725" height="125" rx="14" fill="#fff3bf" stroke="#334155" stroke-width="2"/>
<text x="1187.5" y="1031.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Pipeline: Applied → Screened → Interview → Offer</text><text x="1187.5" y="1058.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Rejected from Applied / Screened / Interview</text><text x="1187.5" y="1086.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Version CAS + history + outbox on every change</text></svg>