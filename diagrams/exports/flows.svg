<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Carieeer system design</title><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1200" fill="white"/>
<text x="40" y="25" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="32" fill="#1e293b">Carieeer - Main flows</text>
<text x="40" y="74" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Solid arrows: request / database work | Dashed arrows: background processing</text>
<text x="40" y="145" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="30" fill="#1e293b">1. Publish a job</text>
<rect x="40" y="215" width="380" height="135" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="230" y="250" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Employer posts job</text><text x="230" y="282.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Backend checks permission</text>
<rect x="560" y="215" width="450" height="135" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="785" y="248.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Save job + pending event</text><text x="785" y="282.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">in one DB transaction</text>
<polyline points="420,285 560,285" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<rect x="1150" y="215" width="400" height="135" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="1350" y="252.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Publisher -&gt; RabbitMQ</text><text x="1350" y="282.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Deliver saved events later</text>
<polyline points="1010,285 1150,285" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<rect x="1150" y="460" width="400" height="135" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="1350" y="493.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Indexing worker</text><text x="1350" y="527.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Update OpenSearch</text>
<polyline points="1350,350 1350,460" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<rect x="560" y="460" width="450" height="135" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="785" y="496.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Matching worker -&gt; engine</text><text x="785" y="527.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Save ranked candidate/job scores</text>
<polyline points="1200,350 1200,395 785,395 785,460" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<rect x="40" y="460" width="380" height="135" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="230" y="495" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Notification worker</text><text x="230" y="527.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Notify relevant candidates</text>
<polyline points="560,530 420,530" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<text x="40" y="705" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="30" fill="#1e293b">2. Apply to a job</text>
<rect x="40" y="780" width="380" height="155" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="230" y="806.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Candidate applies</text><text x="230" y="840.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Authenticated user</text><text x="230" y="874.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Idempotency-Key</text>
<rect x="560" y="780" width="450" height="155" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="785" y="795" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">DB transaction</text><text x="785" y="826.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Lock job and check open</text><text x="785" y="857.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Unique candidate/job insert</text><text x="785" y="888.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Save history + pending event</text>
<polyline points="420,855 560,855" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<rect x="1150" y="780" width="400" height="155" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="1350" y="810.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Publisher -&gt; queue -&gt; worker</text><text x="1350" y="841.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Application notification</text><text x="1350" y="873.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Retry if provider fails</text>
<polyline points="1010,855 1150,855" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#async)"/>
<rect x="40" y="1025" width="1510" height="100" rx="14" fill="#fff3bf" stroke="#334155" stroke-width="2"/>
<text x="795" y="1042.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">201 if created; 409 if duplicate or job closed. Same-key retry returns the original response.</text><text x="795" y="1075" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Status changes check the current version and append a history record.</text></svg>