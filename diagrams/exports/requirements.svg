<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Carieeer system design</title><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1200" fill="white"/>
<text x="40" y="25" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="32" fill="#1e293b">Carieeer - Requirements</text>
<text x="40" y="74" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">What the system should do, and the main quality targets</text>
<rect x="60" y="160" width="700" height="300" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="410" y="225.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Candidate</text><text x="410" y="259.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Edit profile, skills, experience and education</text><text x="410" y="293.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Add career goals and portfolio</text><text x="410" y="326.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Search jobs and apply once per job</text><text x="410" y="360.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">See matches, missing skills and roadmap</text>
<rect x="840" y="160" width="700" height="300" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="1190" y="225.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Employer</text><text x="1190" y="259.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Manage company information</text><text x="1190" y="293.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Create, edit and close jobs</text><text x="1190" y="326.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Search candidates by skills and experience</text><text x="1190" y="360.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Review applications and update status</text>
<rect x="60" y="540" width="1480" height="150" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="800" y="564.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Notifications</text><text x="800" y="598.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Push / in-app updates for matches, application changes and roadmap milestones</text><text x="800" y="631.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Users can change notification preferences</text>
<rect x="60" y="770" width="700" height="280" rx="14" fill="#b2f2bb" stroke="#334155" stroke-width="2"/>
<text x="410" y="812.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Main targets</text><text x="410" y="845" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">99.9% API availability</text><text x="410" y="877.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Profile reads &lt;300 ms; search &lt;500 ms</text><text x="410" y="910" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">No duplicate applications</text><text x="410" y="942.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Search / matching can update shortly later</text><text x="410" y="975" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Targets need testing</text>
<rect x="840" y="770" width="700" height="280" rx="14" fill="#b2f2bb" stroke="#334155" stroke-width="2"/>
<text x="1190" y="812.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Keep it manageable</text><text x="1190" y="845" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Separate backend modules and workers</text><text x="1190" y="877.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Backups and recovery</text><text x="1190" y="910" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Owner / company access checks</text><text x="1190" y="942.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Retry background errors</text><text x="1190" y="975" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1e293b">Monitor latency, errors and queue size</text></svg>