<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Carieeer system design</title><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1200" fill="white"/>
<text x="40" y="25" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="32" fill="#1e293b">Carieeer | Requirements</text>
<text x="40" y="74" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Product commitments • Measurable targets • Proposed, not benchmarked</text>
<rect x="40" y="145" width="470" height="225" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="275" y="188.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">CANDIDATE</text><text x="275" y="216.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Profile, skills, experience, education</text><text x="275" y="243.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Goals and portfolio</text><text x="275" y="271.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Job discovery and saved jobs</text><text x="275" y="298.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Retry-safe applications</text>
<rect x="560" y="145" width="470" height="225" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="795" y="188.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">EMPLOYER</text><text x="795" y="216.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Company and recruiter roles</text><text x="795" y="243.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Draft / publish / close jobs</text><text x="795" y="271.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Consented candidate discovery</text><text x="795" y="298.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Controlled hiring pipeline</text>
<rect x="1080" y="145" width="470" height="225" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/>
<text x="1315" y="188.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">GROWTH &amp; ENGAGEMENT</text><text x="1315" y="216.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Black-box ranked matches</text><text x="1315" y="243.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Target-role skill gaps</text><text x="1315" y="271.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Roadmaps and milestones</text><text x="1315" y="298.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">In-app / email / push preferences</text>
<rect x="40" y="425" width="470" height="225" rx="14" fill="#b2f2bb" stroke="#334155" stroke-width="2"/>
<text x="275" y="468.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">CORE QUALITY</text><text x="275" y="496.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">99.9% core API availability</text><text x="275" y="523.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">p95 reads &lt;200 ms</text><text x="275" y="551.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">p95 apply / status &lt;300 ms</text><text x="275" y="578.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">~930 peak public requests/s</text>
<rect x="560" y="425" width="470" height="225" rx="14" fill="#b2f2bb" stroke="#334155" stroke-width="2"/>
<text x="795" y="468.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">TRUTH &amp; FRESHNESS</text><text x="795" y="496.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">One application / candidate / job</text><text x="795" y="523.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Valid versioned status changes</text><text x="795" y="551.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Search p95 freshness &lt;=60 s</text><text x="795" y="578.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Match p95 freshness &lt;=15 min</text>
<rect x="1080" y="425" width="470" height="225" rx="14" fill="#b2f2bb" stroke="#334155" stroke-width="2"/>
<text x="1315" y="468.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">PROTECTION &amp; RECOVERY</text><text x="1315" y="496.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Tenant scope + candidate consent</text><text x="1315" y="523.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Single-AZ acknowledged RPO 0</text><text x="1315" y="551.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Regional RPO &lt;=5 min</text><text x="1315" y="578.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Regional RTO &lt;=60 min</text>
<rect x="40" y="705" width="730" height="170" rx="14" fill="#fff3bf" stroke="#334155" stroke-width="2"/>
<text x="405" y="735" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">OPERABILITY</text><text x="405" y="762.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Outbox + dedupe + bounded retries + quarantine</text><text x="405" y="790" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Trace request through background work</text><text x="405" y="817.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Alert on queue age, freshness and API SLO burn</text>
<rect x="820" y="705" width="730" height="170" rx="14" fill="#fff3bf" stroke="#334155" stroke-width="2"/>
<text x="1185" y="735" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">MAINTAINABILITY</text><text x="1185" y="762.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">One modular backend; separate worker pools</text><text x="1185" y="790" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Domain-owned tables and versioned contracts</text><text x="1185" y="817.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Expand / contract migrations; restore drills</text>
<rect x="40" y="930" width="1510" height="160" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/>
<text x="795" y="955" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">SCOPE DECISIONS</text><text x="795" y="982.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Applied &gt; Screened &gt; Interview &gt; Offer; Rejected from the first three stages</text><text x="795" y="1010" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Offer and Rejected are terminal. No reapplication to the same job.</text><text x="795" y="1037.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Matching / analysis algorithms, scheduling, hiring acceptance and billing are outside scope.</text></svg>