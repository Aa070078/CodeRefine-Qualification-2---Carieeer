<text x="40" y="1150" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Workers save results to PostgreSQL and update OpenSearch. Optional Redis cache can be added when needed.</text></svg>