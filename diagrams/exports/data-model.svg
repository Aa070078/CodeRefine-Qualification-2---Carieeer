<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Carieeer system design</title><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1200" fill="white"/>
<text x="40" y="25" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="32" fill="#1e293b">Carieeer - Data model</text>
<text x="40" y="74" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Supabase Database (PostgreSQL) is the source of truth. 1:N means one-to-many.</text>
<rect x="40" y="150" width="350" height="130" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="215" y="168.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">User</text><text x="215" y="199.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">id (auth.users.id)</text><text x="215" y="230.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">email, account_type</text>
<rect x="520" y="150" width="470" height="130" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="755" y="168.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">CandidateProfile</text><text x="755" y="199.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">user_id, experience, education</text><text x="755" y="230.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">goal, portfolio, searchable</text>
<polyline points="390,215 520,215" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="409.4" y="186" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : 0..1</text>
<rect x="1115" y="150" width="440" height="130" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="1335" y="171.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Skill + CandidateSkill</text><text x="1335" y="200.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Candidate N:M Skill</text><text x="1335" y="229.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Join: candidate_id, skill_id, level</text>
<polyline points="990,215 1115,215" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<rect x="40" y="385" width="350" height="130" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="215" y="418.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Employer</text><text x="215" y="450" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">user_id, company_id, role</text>
<polyline points="215,280 215,385" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="186.5" y="303.5" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : N</text>
<rect x="520" y="385" width="470" height="130" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="755" y="418.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Company</text><text x="755" y="450" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">id, name, description, website</text>
<polyline points="390,450 520,450" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="426.5" y="421" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">N : 1</text>
<rect x="1115" y="365" width="440" height="170" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="1335" y="392.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Job + JobSkill</text><text x="1335" y="421.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">company_id, title, salary, eligibility</text><text x="1335" y="450" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">status; skills through JobSkill</text><text x="1335" y="478.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Job N:M Skill</text>
<polyline points="990,450 1115,450" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="1024" y="421" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : N</text>
<text x="40" y="590" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Candidate 1:N Application; Job 1:N Application. Candidate N:M Job through Match.</text>
<rect x="40" y="665" width="640" height="160" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="360" y="694.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">Application</text><text x="360" y="728.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">candidate_id, job_id, status, version</text><text x="360" y="761.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">UNIQUE(candidate_id, job_id)</text>
<rect x="825" y="665" width="730" height="160" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="1190" y="694.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">ApplicationStatusHistory</text><text x="1190" y="728.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">application_id, old_status, new_status</text><text x="1190" y="761.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1e293b">changed_by, changed_at</text>
<polyline points="680,745 825,745" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="724" y="716" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : N</text>
<rect x="40" y="920" width="470" height="195" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="275" y="955" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">Match</text><text x="275" y="986.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">candidate_id, job_id, score</text><text x="275" y="1017.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">computed_at</text><text x="275" y="1048.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e293b">One row per candidate / job pair</text>
<rect x="560" y="920" width="470" height="195" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="795" y="960" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">TargetRole -&gt; SkillGap -&gt; Roadmap</text><text x="795" y="988.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Candidate / role each 1:N gaps</text><text x="795" y="1017.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Gap 1:N roadmaps</text><text x="795" y="1046.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e293b">Roadmap contains milestones</text>
<rect x="1080" y="920" width="475" height="195" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="1317.5" y="957.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">Notification + Preference</text><text x="1317.5" y="987.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">User 1:N notifications</text><text x="1317.5" y="1017.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">User 1:1 preference record</text><text x="1317.5" y="1047.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1e293b">event_id, read / delivery state</text></svg>
