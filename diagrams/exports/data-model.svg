<text x="151.5" y="308.5" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : N</text>
<rect x="455" y="385" width="370" height="150" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="640" y="418.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Company</text><text x="640" y="446.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">id PK</text><text x="640" y="473.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">name • verified • version</text>
<polyline points="325,460 455,460" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="361.5" y="431" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">N : 1</text>
<rect x="955" y="385" width="595" height="150" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="1252.5" y="405" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Job</text><text x="1252.5" y="432.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">id PK • company_id FK • state • version</text><text x="1252.5" y="460" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">JobSkill(job_id, skill_id) PK</text><text x="1252.5" y="487.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Skill joins both CandidateSkill and JobSkill</text>
