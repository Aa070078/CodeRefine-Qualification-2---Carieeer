<text x="861.5" y="431" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : N</text>
<rect x="40" y="635" width="580" height="175" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="330" y="667.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Application</text><text x="330" y="695" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">id PK • candidate_id FK • job_id FK</text><text x="330" y="722.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">UQ(candidate_id, job_id) • status • version</text><text x="330" y="750" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">FK(job_id, company_id) • snapshot</text>
<rect x="755" y="635" width="795" height="175" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="1152.5" y="667.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">ApplicationStatusHistory</text><text x="1152.5" y="695" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">(application_id, version) PK • actor_id FK User</text><text x="1152.5" y="722.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">from_status • to_status • changed_at</text><text x="1152.5" y="750" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Append-only; initial Applied entry is version 1</text>
<polyline points="620,720 755,720" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="641.9" y="691" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : 1..N</text>
<text x="40" y="570" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Candidate 1:N Application; Job 1:N Application; Candidate N:M Job via SavedJob</text>
<rect x="40" y="890" width="470" height="185" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="275" y="916.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">MatchSet → Match (1 : 0..100)</text><text x="275" y="943.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Candidate 1:N versioned MatchSets</text><text x="275" y="969.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Match.job_id → Job (N : 1)</text><text x="275" y="995.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Active generation pointer on profile</text><text x="275" y="1021.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">UQ(set_id, job_id) and (set_id, rank)</text>
<rect x="560" y="890" width="470" height="185" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="795" y="916.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">TargetRole → TargetRoleSkill (1:N)</text><text x="795" y="943.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">CareerGoal N:1 TargetRole</text><text x="795" y="969.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Candidate / Role 1:N SkillGap</text><text x="795" y="995.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">SkillGap 1:N Roadmap</text><text x="795" y="1021.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Roadmap 1:N Milestone</text>
<rect x="1080" y="890" width="470" height="185" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="1315" y="916.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">User 1:N Notification / Preference</text><text x="1315" y="943.125" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Notification 1:N Delivery</text><text x="1315" y="969.375" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">UQ(user, event, category)</text><text x="1315" y="995.625" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">OutboxEvent • ConsumerInbox</text><text x="1315" y="1021.875" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">IdempotencyRecord • RecomputeTask</text>
<text x="40" y="1110" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">DB = truth. Redis / OpenSearch are projections; file bytes are private object storage. Full columns: docs/data-model.md</text></svg>