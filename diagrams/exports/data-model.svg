<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><title>Carieeer system design</title><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs><rect width="1600" height="1200" fill="white"/>
<text x="40" y="25" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="32" fill="#1e293b">Carieeer | Relational data model</text>
<text x="40" y="74" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1e293b">Every card is a PostgreSQL entity or explicitly named entity group. Labels state cardinality.</text>
<rect x="40" y="145" width="285" height="145" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="182.5" y="176.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">User</text><text x="182.5" y="203.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">id PK</text><text x="182.5" y="231.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">OIDC issuer + subject UQ</text>
<rect x="455" y="145" width="370" height="145" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="640" y="176.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">CandidateProfile</text><text x="640" y="203.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">user_id PK / FK User</text><text x="640" y="231.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">visibility • version</text>
<polyline points="325,215 455,215" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="344.4" y="186" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : 0..1</text>
<rect x="955" y="130" width="595" height="185" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="1252.5" y="167.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Education • Experience • PortfolioItem</text><text x="1252.5" y="195" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">CareerGoal • FileObject (owned by User)</text><text x="1252.5" y="222.5" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">CandidateSkill(candidate_id, skill_id) PK</text><text x="1252.5" y="250" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Each profile child has candidate_id FK</text>
<polyline points="825,215 955,215" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#sync)"/>
<text x="844.4" y="186" dominant-baseline="hanging" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">1 : 0..N</text>
<rect x="40" y="385" width="285" height="150" rx="0" fill="#c3fae8" stroke="#334155" stroke-width="2"/>
<text x="182.5" y="418.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">Employer membership</text><text x="182.5" y="446.25" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">(user_id, company_id) PK</text><text x="182.5" y="473.75" dominant-baseline="hanging" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1e293b">role • active</text>
